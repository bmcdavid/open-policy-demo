# Each overlay replaces the hostname with api.<env>.localtest.me.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    owner: lab
spec:
  parentRefs:
    - name: lab
      namespace: envoy-gateway-system
  hostnames: [api.unset.localtest.me]
  rules:
    - backendRefs:
        - name: api
          port: 80
