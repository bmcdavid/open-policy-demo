# A ServiceAccount is a pod's identity toward the Kubernetes API (like an ECS task role). These pods never call the
# API, so the token is not mounted at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    owner: lab
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    owner: lab
automountServiceAccountToken: false
