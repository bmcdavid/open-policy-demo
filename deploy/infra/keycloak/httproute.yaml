# An HTTPRoute attaches to a Gateway and sends matching hosts/paths to a Service (like an ALB rule + target group).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    owner: lab
spec:
  parentRefs:
    - name: lab
      namespace: envoy-gateway-system
  hostnames: [keycloak.localtest.me]
  rules:
    - backendRefs:
        - name: keycloak
          port: 8080
