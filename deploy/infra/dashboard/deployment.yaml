# Standalone Aspire Dashboard: receives OTLP (traces, logs, metrics) from every app pod. Telemetry is in memory only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aspire-dashboard
  labels:
    app.kubernetes.io/name: aspire-dashboard
    owner: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aspire-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aspire-dashboard
        owner: lab
    spec:
      containers:
        - name: dashboard
          image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.1
          env:
            # UNAUTHENTICATED: no login on the UI and no API key on OTLP. Lab only.
            - name: ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS
              value: "true"
          ports:
            - name: ui
              containerPort: 18888
            - name: otlp-grpc
              containerPort: 18889
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: ui }
            periodSeconds: 5
