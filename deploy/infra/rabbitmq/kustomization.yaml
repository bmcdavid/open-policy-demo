apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - statefulset.yaml
  - service.yaml
configMapGenerator:
  - name: rabbitmq-config
    literals:
      # Users, vhosts and permissions come from the rabbitmq Secret (infra-secrets), mounted below conf.d.
      - 20-lab.conf=load_definitions = /etc/rabbitmq/definitions/definitions.json
