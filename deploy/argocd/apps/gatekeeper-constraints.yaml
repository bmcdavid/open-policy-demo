apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper-constraints
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/bmcdavid/open-policy-demo.git
    targetRevision: k8s
    path: deploy/platform/gatekeeper-policies/constraints
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Each constraint kind (e.g. K8sDisallowedTags) only exists once its template has been processed.
      - SkipDryRunOnMissingResource=true
