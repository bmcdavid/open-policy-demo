# The prod api Deployment with 2 replica(s); only replicas matter to this constraint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: app-prod
  labels:
    app.kubernetes.io/name: api
    owner: lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        owner: lab
    spec:
      containers:
        - name: api
          image: localhost:5001/api:01ae60d
