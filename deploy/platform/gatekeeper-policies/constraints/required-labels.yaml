apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredLabels
metadata:
  name: name-and-owner-labels
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: [Pod]
    namespaceSelector:
      matchExpressions:
        - key: lab.dev/tier
          operator: In
          values: [infra, app]
  parameters:
    labels:
      - key: app.kubernetes.io/name
      - key: owner
