# The prod Api keeps at least two pods, so one can be replaced while the other serves.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sReplicaLimits
metadata:
  name: prod-api-min-two-replicas
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [apps]
        kinds: [Deployment]
    namespaces: [app-prod]
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: api
  parameters:
    ranges:
      - min_replicas: 2
        max_replicas: 10
